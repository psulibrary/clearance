<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – PSU Library Clearance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stat-card { border-radius: 12px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="dashboard.html">
      <i class="bi bi-book-half me-2"></i>PSU Library Clearance System
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="navbar-text text-white me-2">
        <i class="bi bi-person-circle me-1"></i><span id="nav-name"></span>
        <span id="nav-role-badge" class="badge bg-warning text-dark ms-1"></span>
      </span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </div>
</nav>

<div class="container mb-5">
  <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

  <!-- Main Library Dashboard -->
  <div id="main-dash" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold mb-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>Main Library Dashboard</h4>
      <button class="btn btn-warning" onclick="sendReminders()">
        <i class="bi bi-envelope-exclamation me-1"></i>Send Email Reminders
      </button>
    </div>
    <!-- Stats -->
    <div class="row g-3 mb-4" id="stats-row">
      <div class="col-6 col-md-3"><div class="card stat-card text-center p-3 border-start border-4 border-primary"><div class="fs-2 fw-bold text-primary" id="stat-total">—</div><div class="text-muted small">Total Clients</div></div></div>
      <div class="col-6 col-md-3"><div class="card stat-card text-center p-3 border-start border-4 border-warning"><div class="fs-2 fw-bold text-warning" id="stat-pending">—</div><div class="text-muted small">Pending</div></div></div>
      <div class="col-6 col-md-3"><div class="card stat-card text-center p-3 border-start border-4 border-success"><div class="fs-2 fw-bold text-success" id="stat-cleared">—</div><div class="text-muted small">Cleared</div></div></div>
      <div class="col-6 col-md-3"><div class="card stat-card text-center p-3 border-start border-4 border-danger"><div class="fs-2 fw-bold text-danger" id="stat-rejected">—</div><div class="text-muted small">Rejected</div></div></div>
    </div>
    <!-- Filters -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Search</label>
            <input type="text" id="f-search" class="form-control form-control-sm" placeholder="Name or Student ID…">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold">Status</label>
            <select id="f-status" class="form-select form-select-sm">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="cleared">Cleared</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold">Branch</label>
            <select id="f-branch" class="form-select form-select-sm">
              <option value="">All Branches</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary btn-sm w-100" onclick="loadClients()">
              <i class="bi bi-funnel me-1"></i>Filter
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Branch Dashboard -->
  <div id="branch-dash" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold mb-0"><i class="bi bi-building me-2 text-primary"></i>Branch Dashboard</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addClientModal">
        <i class="bi bi-person-plus me-1"></i>Add New Client
      </button>
    </div>
  </div>

  <!-- Clients Table (shared) -->
  <div class="card">
    <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
      <span><i class="bi bi-people me-2 text-primary"></i>Clients <span class="badge bg-secondary ms-1" id="client-count">0</span></span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle small">
        <thead class="table-light">
          <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Course</th>
            <th class="text-center">Accountabilities</th>
            <th class="text-center">Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="clients-tbody">
          <tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Client Modal (branch only) -->
<div class="modal fade" id="addClientModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold"><i class="bi bi-person-plus me-2"></i>Add New Client</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="add-client-form">
        <div class="modal-body">
          <div id="add-client-error" class="alert alert-danger d-none"></div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Student ID *</label>
              <input type="text" name="student_id" class="form-control" placeholder="e.g. 2021-00001" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">First Name *</label>
              <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Last Name *</label>
              <input type="text" name="last_name" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Email *</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-8">
              <label class="form-label fw-semibold">Course</label>
              <input type="text" name="course" class="form-control" placeholder="e.g. BS Computer Science">
            </div>
            <div class="col-4">
              <label class="form-label fw-semibold">Year Level</label>
              <input type="text" name="year_level" class="form-control" placeholder="e.g. 4th Year">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Client</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  const user = getUser();

  // Setup navbar
  document.getElementById('nav-name').textContent = user?.full_name || user?.username || '';
  document.getElementById('nav-role-badge').textContent = user?.role === 'main_library' ? 'Main Library' : 'Library In Charge';

  // Show role-appropriate dashboard
  if (user?.role === 'main_library') {
    document.getElementById('main-dash').classList.remove('d-none');
    loadStats();
    loadBranches();
  } else {
    document.getElementById('branch-dash').classList.remove('d-none');
  }
  loadClients();

  async function loadStats() {
    try {
      const s = await api.stats();
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-pending').textContent = s.pending;
      document.getElementById('stat-cleared').textContent = s.cleared;
      document.getElementById('stat-rejected').textContent = s.rejected;
    } catch {}
  }

  async function loadBranches() {
    try {
      const branches = await api.branches();
      const sel = document.getElementById('f-branch');
      branches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id;
        opt.textContent = b.name;
        sel.appendChild(opt);
      });
    } catch {}
  }

  async function loadClients() {
    const tbody = document.getElementById('clients-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>';
    try {
      let qs = '';
      if (user?.role === 'main_library') {
        const params = new URLSearchParams();
        const search = document.getElementById('f-search')?.value;
        const status = document.getElementById('f-status')?.value;
        const branch = document.getElementById('f-branch')?.value;
        if (search) params.set('search', search);
        if (status) params.set('status', status);
        if (branch) params.set('branch', branch);
        if (params.toString()) qs = '?' + params.toString();
      }
      const clients = await api.clients(qs);
      document.getElementById('client-count').textContent = clients.length;

      if (!clients.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No clients found.</td></tr>';
        return;
      }

      tbody.innerHTML = clients.map(c => `
        <tr>
          <td><code>${escHtml(c.student_id)}</code></td>
          <td class="fw-semibold">${escHtml(c.first_name)} ${escHtml(c.last_name)}</td>
          <td>${escHtml(c.branch_name) || '—'}</td>
          <td>${escHtml(c.course) || '—'}</td>
          <td class="text-center">
            <span class="badge ${c.unresolved_count > 0 ? 'bg-danger' : 'bg-success'}">
              ${c.unresolved_count} unresolved / ${c.total_accountabilities} total
            </span>
          </td>
          <td class="text-center">${statusBadge(c.status)}</td>
          <td class="text-center">
            <a href="client.html?id=${c.id}" class="btn btn-sm btn-outline-primary">
              <i class="bi bi-eye me-1"></i>View
            </a>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error loading clients: ${escHtml(e.error || String(e))}</td></tr>`;
    }
  }

  async function sendReminders() {
    if (!confirm('Send email reminders to all clients with unresolved accountabilities?')) return;
    try {
      const res = await api.sendReminders();
      showToast(res.message || `Reminders sent to ${res.sent} client(s).`, 'success');
    } catch (e) {
      showToast(e.error || 'Failed to send reminders.', 'danger');
    }
  }

  document.getElementById('add-client-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errDiv = document.getElementById('add-client-error');
    errDiv.classList.add('d-none');
    const form = e.target;
    const data = {
      student_id: form.student_id.value,
      first_name: form.first_name.value,
      last_name: form.last_name.value,
      email: form.email.value,
      course: form.course.value,
      year_level: form.year_level.value,
    };
    try {
      const client = await api.createClient(data);
      bootstrap.Modal.getInstance(document.getElementById('addClientModal')).hide();
      form.reset();
      showToast(`Client ${client.first_name} ${client.last_name} added.`, 'success');
      loadClients();
    } catch (err) {
      errDiv.textContent = err.error || JSON.stringify(err);
      errDiv.classList.remove('d-none');
    }
  });

  function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
  }

  function showToast(msg, type = 'success') {
    const id = 'toast-' + Date.now();
    const html = `<div id="${id}" class="toast align-items-center text-bg-${type} border-0 mb-2" role="alert">
      <div class="d-flex"><div class="toast-body">${escHtml(msg)}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
    </div>`;
    document.getElementById('toast-container').insertAdjacentHTML('beforeend', html);
    const el = document.getElementById(id);
    new bootstrap.Toast(el, { delay: 4000 }).show();
    el.addEventListener('hidden.bs.toast', () => el.remove());
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
