<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – PSU Library Clearance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
      <div class="card login-card">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-book-half text-primary" style="font-size:2.5rem"></i>
            <h5 class="fw-bold mt-2 mb-0">PSU Library Clearance</h5>
            <small class="text-muted">Palawan State University</small>
          </div>
          <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold" id="login-btn">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script>
  // Already logged in?
  if (localStorage.getItem('access_token')) window.location.href = 'dashboard.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errDiv = document.getElementById('error-msg');
    errDiv.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Signing in…';
    try {
      const res = await api.login(
        document.getElementById('username').value,
        document.getElementById('password').value
      );
      localStorage.setItem('access_token', res.access);
      localStorage.setItem('refresh_token', res.refresh);
      localStorage.setItem('user', JSON.stringify(res.user));
      window.location.href = 'dashboard.html';
    } catch (err) {
      errDiv.textContent = err.error || 'Login failed. Check your credentials.';
      errDiv.classList.remove('d-none');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Sign In';
    }
  });
</script>
</body>
</html>
